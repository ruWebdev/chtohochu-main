# GitHub Actions workflows are path-aware because this is a monorepo.
# Each workflow only triggers when files in its relevant paths change.

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/api/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/api/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend/api

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, gd, zip, intl
          coverage: xdebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Pint
        run: vendor/bin/pint --test
      - name: Run tests
        run: php artisan test --parallel
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_PORT: 5432
          DB_DATABASE: chtohochu_test
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
