# GitHub Actions workflows are path-aware because this is a monorepo.
# Each workflow only triggers when files in its relevant paths change.

name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'backend/api/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/api/**'
      - '.github/workflows/backend.yml'

defaults:
  run:
    working-directory: backend/api

jobs:
  test:
    runs-on: ubuntu-latest
    # phpunit.xml force-ит DB_* (host `postgres`, база chtohochu_testing,
    # user chtohochu) — сервис поднимается с теми же кредами, а шаг
    # "Map postgres host" алиасит имя на localhost раннера.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: chtohochu
          POSTGRES_PASSWORD: chtohochu
          POSTGRES_DB: chtohochu_testing
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U chtohochu -d chtohochu_testing"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: pdo_pgsql, pgsql, redis, bcmath, gd, zip, intl
          coverage: xdebug
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist
      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate
      - name: Run Pint
        run: vendor/bin/pint --test
      - name: Map postgres host
        run: echo "127.0.0.1 postgres" | sudo tee -a /etc/hosts
      - name: Run tests
        run: php artisan test --parallel
